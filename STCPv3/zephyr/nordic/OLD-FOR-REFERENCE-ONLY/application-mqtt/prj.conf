# STCPv2 Zephyr clean application base configuration.
#
# Keep this file present because Zephyr requires application/prj.conf.
# The transport/build-specific settings are supplied by EXTRA_CONF_FILE,
# currently application/ethernet-v2.conf.
#
# Intentionally empty.

# MQTT over STCP
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_CUSTOM_TRANSPORT=y
CONFIG_MQTT_VERSION_3_1_1=y
CONFIG_MQTT_KEEPALIVE=60
CONFIG_MQTT_LOG_LEVEL_INF=y
