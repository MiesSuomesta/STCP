name: STCP overnight full run

on:
  workflow_dispatch:
    inputs:
      skip_compile:
        description: Use existing compiled artifacts (default rebuilds)
        type: boolean
        default: false
      site_mode:
        description: Site generation and publication
        type: choice
        options: [none, preview, publish]
        default: preview
  schedule:
    # UTC; 01:00 in Finland during summer, 00:00 during winter.
    - cron: '0 22 * * *'

permissions:
  contents: read

jobs:
  overnight:
    runs-on: [self-hosted, linux, x64, stcp-builder]
    timeout-minutes: 1440
    concurrency:
      group: stcp-hardware
      cancel-in-progress: false
    env:
      STCP_PROJECT_ROOT: /srv/stcp-project
      STCP_CI_PYTHON: ${{ vars.STCP_CI_PYTHON }}
      STCP_CI_SKIP_COMPILE: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_compile && 'true' || 'false' }}
      STCP_CI_SITE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.site_mode || 'preview' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: All phases, regression and benchmarks
        shell: bash
        run: bash .github/scripts/stcp-ci.sh overnight
      - name: Upload current full run and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stcp-overnight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## STCP full run: host/Raspberry, Zephyr, CoAP, MQTT, P2P (ETH/LTE)'
            echo "Workflow commit: $GITHUB_SHA"
            echo 'See full-run.log, revisions.json and per-phase results in the artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
