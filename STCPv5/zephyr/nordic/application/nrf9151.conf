#
# LTE / nRF91 network
#
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y

#
# nRF91 modem
#
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_LC_PDN_MODULE=y

CONFIG_LTE_NETWORK_MODE_LTE_M=y
CONFIG_LTE_PSM_REQ=n
CONFIG_LTE_EDRX_REQ=n

#
# Console / logging
#
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_UART_NRFX=y

#
# LTE transport
#
CONFIG_STCP_LTE_REG_TIMEOUT_SECONDS=300
CONFIG_STCP_LTE_PDN_TIMEOUT_SECONDS=300

CONFIG_STCP_LTE_CUSTOM_PDN=y
CONFIG_STCP_LTE_FORCE_DEFAULT_APN=y
CONFIG_STCP_LTE_DEFAULT_APN="internet"
CONFIG_STCP_LTE_APN="internet"


#
# STCP application / benchmark
#
CONFIG_MQTT_LIB=y
CONFIG_STCP=y
CONFIG_STCP_BENCH_SHELL=y
CONFIG_STCP_BENCH_AUTORUN=n
CONFIG_BENCH_STCP_BLOCKING_CONNECT=y

CONFIG_ECHO_TRANSPORT_STCP=y
CONFIG_ECHO_SERVER_HOST="lja.fi"
CONFIG_ECHO_SERVER_PORT="19000"
CONFIG_ECHO_SOCKET_TIMEOUT_MS=60000
CONFIG_BENCH_TOTAL_BYTES=1048576
CONFIG_BENCH_MAX_CHUNK_SIZE=65536
CONFIG_BENCH_CHUNK_SIZE=4096
CONFIG_BENCH_PAUSE_SECONDS=5
CONFIG_BENCH_REPORT_INTERVAL_MS=5000
CONFIG_BENCH_SENDER_STACK_SIZE=4096
CONFIG_BENCH_FULL_RX_BUFFER_SIZE=4096
CONFIG_BENCH_WORKER_STACK_SIZE=8192
CONFIG_BENCH_WORKER_PRIORITY=5

#
# Memory / utilities
#
CONFIG_HEAP_MEM_POOL_SIZE=40960
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_RING_BUFFER=y
CONFIG_REBOOT=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_THREAD_NAME=y
CONFIG_ASSERT=y
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_ASSERT_VERBOSE=n
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="stcp> "

#
# STCP Zephyr adapter / Rust core
#
CONFIG_STCP_SOCKET_PRIORITY=20
CONFIG_STCP_MAX_SOCKETS=2
CONFIG_STCP_CONNECT_TIMEOUT_MS=60000
CONFIG_STCP_LOG_LEVEL=3
CONFIG_STCP_RUST_TOOLCHAIN="nightly"
CONFIG_STCP_RUST_RX_STACK_SIZE=8192
CONFIG_STCP_RUST_RX_PRIORITY=7
CONFIG_STCP_RUST_RX_BUFFER_SIZE=2048
CONFIG_STCP_RUST_X25519_SOFTWARE=y
CONFIG_STCP_RUST_TRACE_WIRE=n
CONFIG_STCP_RUST_TRACE_EVENTS=n
CONFIG_STCP_RUST_TRACE_ALLOC=n
CONFIG_STCP_RUST_TRACE_CRYPTO=n
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
