name: STCP build

on:
  push:
    branches: [main, master, develop]
    paths: ['kernel/**', 'scripts/**', 'MiniSDK/**', 'tests/**', '.github/**', 'STCP/kernel/**']
  pull_request:
    paths: ['kernel/**', 'scripts/**', 'MiniSDK/**', 'tests/**', '.github/**', 'STCP/kernel/**']
  workflow_dispatch:
    inputs:
      build_linux:
        description: Build Linux x86_64 and Raspberry Pi ARM64 modules
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate maintained scripts
        shell: bash
        run: bash .github/scripts/stcp-ci.sh validate

  linux-kernel-modules:
    needs: validate
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.build_linux)
    runs-on: [self-hosted, linux, x64, stcp-builder]
    timeout-minutes: 360
    concurrency:
      group: stcp-hardware
      cancel-in-progress: false
    env:
      X86_KDIR: ${{ vars.STCP_X86_KDIR }}
      RPI_KDIR: ${{ vars.STCP_RPI_KDIR }}
      RUST_TOOLCHAIN: ${{ vars.STCP_RUST_TOOLCHAIN || 'nightly' }}
      CROSS_COMPILE: aarch64-linux-gnu-
      JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and verify both architectures
        shell: bash
        run: bash .github/scripts/stcp-ci.sh build
      - name: Upload modules and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stcp-linux-modules-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14
