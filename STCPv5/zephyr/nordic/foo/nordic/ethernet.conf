# nRF9151 DK + Seeed W5500 transport only.

CONFIG_NET_NATIVE=y
CONFIG_NET_SOCKETS_OFFLOAD=n
CONFIG_NET_IPV6=n
CONFIG_NET_BUF=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_ARP=y
CONFIG_ETH_W5500=y
CONFIG_SPI=y
CONFIG_GPIO=y

# Static LAN configuration
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=10
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.50"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.1.111"

# Network diagnostics
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_SHELL=y
CONFIG_NET_STATISTICS=y

# Ethernet driver / memory
CONFIG_ETH_W5500_RX_THREAD_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Modem stack is not part of Ethernet build
CONFIG_NRF_MODEM_LIB=n
CONFIG_LTE_LINK_CONTROL=n
CONFIG_PDN=n
