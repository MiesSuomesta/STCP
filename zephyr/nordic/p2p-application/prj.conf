# STCP native P2P application only.

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="p2p> "
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_LOG_RUNTIME_FILTERING=n
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_MODE_DEFERRED=n
CONFIG_LOG_PRINTK=n
CONFIG_LOG_DEFAULT_LEVEL=2

# Application memory / diagnostics
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_THREAD_STACK_INFO=y
CONFIG_ETH_W5500_RX_THREAD_STACK_SIZE=4096

# Native P2P benchmark
CONFIG_P2P_BENCH_HOST="192.168.1.20"
CONFIG_P2P_BENCH_PORT="19010"
CONFIG_P2P_BENCH_PAYLOAD_SIZE=4096
CONFIG_P2P_BENCH_TOTAL_BYTES=1048576
CONFIG_P2P_BENCH_TIMEOUT_MS=30000
CONFIG_P2P_BENCH_WORKER_STACK_SIZE=8192
CONFIG_P2P_BENCH_WORKER_PRIORITY=5
