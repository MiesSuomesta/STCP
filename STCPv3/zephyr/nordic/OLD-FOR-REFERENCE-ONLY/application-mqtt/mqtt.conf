# Additive config on top of duplicated golden Zephyr application.

CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_CUSTOM_TRANSPORT=y
CONFIG_MQTT_VERSION_3_1_1=y
CONFIG_MQTT_KEEPALIVE=60
CONFIG_MQTT_LOG_LEVEL_INF=y

# Keep the proven STCP settings explicit in this project.
CONFIG_STCP_V2=y
CONFIG_STCP_V2_MAX_SOCKETS=2
CONFIG_STCP_V2_CONNECT_TIMEOUT_MS=60000
CONFIG_STCP_V2_RX_STACK_SIZE=8192
CONFIG_STCP_V2_RX_PRIORITY=7
CONFIG_STCP_V2_RX_BUFFER_SIZE=2048
