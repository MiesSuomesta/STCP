# STCP CoAP application only.

CONFIG_COAP=y
CONFIG_STCP_COAP_INTERVAL_MS=2000

# Application memory / diagnostics
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_STACK_SENTINEL=y

# CoAP build needs a larger W5500 RX worker than the base application.
CONFIG_ETH_W5500_RX_THREAD_STACK_SIZE=16384
