# STCP Ethernet build for nRF9151 DK + Seeed W5500

# Optimoinita
CONFIG_LOG_RUNTIME_FILTERING=n
CONFIG_SHELL_STACK_SIZE=8192

# Console and shell
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="p2p> "

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_MODE_DEFERRED=n

# Älä ohjaa printk:iä deferred loggerin kautta.
CONFIG_LOG_PRINTK=n

CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_KERNEL_LOG_LEVEL_WRN=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_SPI_LOG_LEVEL_WRN=y
CONFIG_ETHERNET_LOG_LEVEL_INF=y
CONFIG_NET_LOG=n

# Native Zephyr network stack
CONFIG_NETWORKING=y
CONFIG_NET_BUF=y
CONFIG_NET_NATIVE=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=n
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_W5500=y
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_NET_ARP=y

# Static LAN configuration
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=10
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.50"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.1.111"

# Network management and diagnostics
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_SHELL=y
CONFIG_NET_STATISTICS=y


# Memory
#CONFIG_HEAP_MEM_POOL_SIZE=98304
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ETH_W5500_RX_THREAD_STACK_SIZE=4096

# Utilities
CONFIG_RING_BUFFER=y
CONFIG_REBOOT=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_THREAD_NAME=y
CONFIG_ASSERT=y
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_ASSERT_VERBOSE=n


# Ethernet build: modem/LTE stack disabled
CONFIG_NRF_MODEM_LIB=n
CONFIG_LTE_LINK_CONTROL=n
CONFIG_PDN=n


# PSA_CRYPTO_CLIENT is generated/hidden in NCS 3.3.0; do not assign it directly.
# Client benchmark needs one active STCP socket; keep one spare for recovery.
# The RX stack is embedded in every pool entry, so limiting the pool saves
# 24+ KiB of static RAM compared with the default eight sockets.
CONFIG_MBEDTLS_PSA_CRYPTO_C=y

CONFIG_THREAD_STACK_INFO=y



# Clean STCP Zephyr adapter: custom AF_STCP provider, not global socket offload.
CONFIG_STCP=y
CONFIG_STCP_SOCKET_PRIORITY=20
CONFIG_STCP_MAX_SOCKETS=2
CONFIG_STCP_CONNECT_TIMEOUT_MS=60000
CONFIG_STCP_LOG_LEVEL=3
CONFIG_STCP_RUST_TOOLCHAIN="nightly"
#CONFIG_STCP_RX_STACK_SIZE=3072
CONFIG_STCP_RX_STACK_SIZE=8192
CONFIG_STCP_RX_PRIORITY=7
CONFIG_STCP_RX_BUFFER_SIZE=2048
CONFIG_STCP_X25519_SOFTWARE=y
CONFIG_STCP_TRACE_WIRE=n
CONFIG_STCP_TRACE_EVENTS=n
CONFIG_STCP_TRACE_ALLOC=n
CONFIG_STCP_TRACE_CRYPTO=n



# Native P2P application
CONFIG_P2P_BENCH_HOST="192.168.1.20"
CONFIG_P2P_BENCH_PORT="19010"
CONFIG_P2P_BENCH_PAYLOAD_SIZE=4096
CONFIG_P2P_BENCH_TOTAL_BYTES=1048576
CONFIG_P2P_BENCH_TIMEOUT_MS=30000
CONFIG_P2P_BENCH_WORKER_STACK_SIZE=8192
CONFIG_P2P_BENCH_WORKER_PRIORITY=5
